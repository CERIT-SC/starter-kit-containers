# Default configuration for FDP Helm chart
# This file contains generic/default configurations that could be used by anyone deploying this chart.
# For user-specific overrides, create a separate my-values.yaml file.

nameOverride: ""
fullnameOverride: ""

server:
  image:
    repository: fairdata/fairdatapoint
    tag: "1.18"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  env: {}
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 1
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    clientUrl: https://example.com
    persistentUrl: https://example.com
    jwtSecret: "" # SET THIS TO A RANDOM SECURE VALUE
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""  # use default storage class


client:
  image:
    repository: cerit.io/gdi/fdp-client
    tag: "2025-10-08"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  env: {}
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 1
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/tls-acme: 'true'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
  hosts:
    - host: 'example.com'
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: example-com-tls
     hosts:
       - example.com

mongodb:
  imageTag: latest
  bootstrap:
    db: fdp
    username: root
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    privileged: false
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  pvc:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
